
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #0ea5e9;
            --bg: #050505;
            --surface: #0a0a0a;
            --border: #1f1f1f;
        }
        body {
            background-color: var(--bg);
            color: #ffffff;
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
            overflow: hidden;
            transition: --accent 0.3s ease;
        }
        
        /* Live Modern Texture */
        .live-texture {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: var(--bg);
            background-image: 
                linear-gradient(var(--accent) 0.5px, transparent 0.5px),
                linear-gradient(90deg, var(--accent) 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            opacity: 0.05;
            pointer-events: none;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            opacity: 0.1;
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 8s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        .card-imperium {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .text-accent { color: var(--accent); }
        .bg-accent { background-color: var(--accent); }
        .border-accent { border-color: var(--accent); }

        h1, h2, h3 { font-weight: 700; letter-spacing: -0.05em; }
        ::selection { background: var(--accent); color: #000; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
</head>
<body>
    <div class="live-texture"></div>
    <div class="scanline"></div>
    <div id="root"></div>
    <script>
        // Apply persisted accent color on load
        const savedAccent = localStorage.getItem('metalab_accent_color') || '#0ea5e9';
        document.documentElement.style.setProperty('--accent', savedAccent);
    </script>
</body>
</html>
